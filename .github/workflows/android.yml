name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64, APK sẽ ký bằng debug key ngẫu nhiên."
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk AutoClicker.apk
      # App đọc file này để biết có bản mới (xem UpdateChecker.kt).
      - name: Write version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          notes = (os.environ.get("NOTES") or "").split("\n\n")[0].strip()
          json.dump({"versionCode": 100 + run, "versionName": f"1.3.{run}", "notes": notes},
                    open("version.json", "w"), ensure_ascii=False)
          PY
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-apk
          path: android/AutoClicker.apk
      # Bản mới nhất từ nhánh main: tải trực tiếp trên điện thoại ở trang Releases.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AutoClicker (bản mới nhất)
          body: Bản build tự động từ nhánh main (${{ github.sha }}). Tải AutoClicker.apk về điện thoại Android và cài đặt.
          files: |
            android/AutoClicker.apk
            android/version.json
          make_latest: true
